name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: HealingPlaceDispatch-Windows.zip
          - os: macos-latest
            asset_name: HealingPlaceDispatch-macOS.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit tinydb pyinstaller pillow

      - name: Run Build Script
        run: python build.py

      - name: Archive Release (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "dist\HealingPlaceDispatch" -DestinationPath "${{ matrix.asset_name }}" -Force

      - name: Archive Release (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r "../${{ matrix.asset_name }}" HealingPlaceDispatch

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}